[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icm-calibration-workbench"
version = "0.1.0.dev0"
description = "Local engineering workbench for auditable analysis of exported ICM calibration datasets"
requires-python = ">=3.11,<3.14"
dependencies = [
  "dash>=2.17,<4",
  "plotly>=5.22,<7",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=14,<25",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
icm-workbench = "icm_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

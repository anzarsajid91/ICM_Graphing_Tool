name: UIUX baseline and candidate review
on:
  push:
    branches: [feat/unified-premium-uiux]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.ref == 'refs/heads/feat/unified-premium-uiux' || github.head_ref == 'feat/unified-premium-uiux'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -e . pytest
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Source, privacy and Python baseline gates
        run: |
          python scripts/verify_data_confidentiality.py
          python -m unittest discover -s tests/privacy -v
          python -m pytest
          for f in web/tests/*unit.mjs; do node "$f"; done
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_EVENT_NAME=pull_request python scripts/build_pages.py
      - name: Render all routes and exercise supported workflows
        env:
          ICM_BROWSER: chromium
          ICM_EVIDENCE_DIR: /tmp/hydra-uiux/workflows
          ICM_UIUX_EVIDENCE: /tmp/hydra-uiux/routes
        run: |
          python -m http.server 8000 --directory _site >/tmp/hydra-uiux-http.log 2>&1 &
          SERVER_PID=$!
          python -m http.server 8002 --directory web >/tmp/hydra-showcase-http.log 2>&1 &
          SHOWCASE_PID=$!
          trap 'kill "$SERVER_PID" "$SHOWCASE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null 2>&1 && break
            sleep 1
          done
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node web/tests/uiux-review.mjs
          node web/tests/uiux-contracts.mjs
          node web/tests/uiux-showcase.mjs
          node web/tests/cold-start-shell.mjs
          node web/tests/precision-shell.mjs
          node web/tests/workspace-interactions.mjs
          node web/tests/network-schematic-smoke.mjs
          node web/tests/network-review-smoke.mjs
          node web/tests/network-layout-smoke.mjs
          node web/tests/smoke.mjs
          node web/tests/detriment-smoke.mjs
          node web/tests/detriment-reference-smoke.mjs
          node web/tests/schematic-review-smoke.mjs
          node web/tests/audit-release-smoke.mjs
      - name: Retain synthetic-only review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uiux-review-${{ github.sha }}
          retention-days: 30
          path: |
            /tmp/hydra-uiux/
            /tmp/hydra-uiux-http.log
            /tmp/icm-workbench-failure.png

name: Retired reference evidence inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: retired-reference-evidence-inventory
  cancel-in-progress: true

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Inventory retired evidence without modifying artifacts or logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE_UPLOAD_NOT_BEFORE: '2026-09-20T13:11:47Z'
        run: python scripts/purge_retired_reference_evidence.py

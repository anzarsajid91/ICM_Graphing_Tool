name: Retired reference evidence cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/purge_retired_reference_evidence.py'
      - '.github/workflows/reference-evidence-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retired-reference-evidence-final
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Remove retired source evidence and logs only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE_UPLOAD_NOT_BEFORE: '2026-09-20T13:11:47Z'
        run: python scripts/purge_retired_reference_evidence.py

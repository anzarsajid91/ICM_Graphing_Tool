name: Data confidentiality

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  confidentiality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Enforce mandatory data-confidentiality source review
        run: python scripts/verify_data_confidentiality.py
      - name: Verify confidentiality guards reject prohibited transmissions
        run: |
          python -m unittest discover -s tests/privacy -v
          node web/tests/privacy-network-unit.mjs

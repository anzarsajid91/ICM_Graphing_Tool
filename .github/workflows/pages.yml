name: GitHub Pages Workbench

on:
  push:
    branches: [main, feat/github-pages-zero-install]
    paths:
      - 'web/**'
      - 'src/icm_workbench/**'
      - 'tests/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install reference engine dependencies
        run: python -m pip install -e . pytest
      - name: Run Python regression suite
        run: python -m pytest
      - name: Validate browser JavaScript and bridge syntax
        run: |
          node --check web/assets/app.js
          node --check web/tests/smoke.mjs
          python -m py_compile web/python_bridge.py

  browser-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assemble static browser artifact
        run: |
          rm -rf _site
          mkdir -p _site/python
          cp -R web/. _site/
          cp -R src/icm_workbench _site/python/icm_workbench
          rm -rf _site/tests
          touch _site/.nojekyll
      - name: Install Chromium acceptance runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise real browser workflow
        run: |
          python -m http.server 8000 --directory _site >/tmp/icm-pages-http.log 2>&1 &
          node web/tests/smoke.mjs

  build:
    runs-on: ubuntu-latest
    needs: browser-smoke
    steps:
      - uses: actions/checkout@v6
      - name: Build static Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/python
          cp -R web/. _site/
          cp -R src/icm_workbench _site/python/icm_workbench
          rm -rf _site/tests
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: GitHub Pages Workbench

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/icm_workbench/**'
      - 'tests/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/live-pages-verification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/icm_workbench/**'
      - 'tests/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/live-pages-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install reference engine dependencies
        run: python -m pip install -e . pytest
      - name: Run Python regression suite
        run: python -m pytest
      - name: Validate release browser source
        run: |
          node --check web/assets/runtime.release.js
          node --check web/assets/analysis-worker.js
          node --check web/assets/fastpath-core.js
          node --check web/assets/fastpath-worker.js
          node --check web/assets/fastpath-preview.js
          node --check web/assets/domain-registry.js
          node --check web/assets/workbench-v2.js
          node --check web/assets/workbench-v2-domfix.js
          node --check web/assets/workbench-v3.js
          node --check web/assets/workbench-survey.js
          node --check web/assets/workflow-26.js
          node --check web/assets/precision-workbench.js
          node --check web/tests/smoke.mjs
          node --check web/tests/precision-shell.mjs
          node --check web/tests/baseline-comparison.mjs
          node web/tests/graph-report-unit.mjs
          node web/tests/runtime-unit.mjs
          node web/tests/domain-registry-unit.mjs
          node --check web/tests/fastpath-unit.mjs
          node --check web/tests/fastpath-reference.mjs
          node web/tests/fastpath-unit.mjs
          node web/tests/fastpath-reference.mjs
          node web/tests/fastpath-equivalence.mjs
          python -m py_compile web/python_bridge.py web/advanced_bridge.py src/icm_workbench/browser_api.py src/icm_workbench/advanced_api.py scripts/build_pages.py scripts/validate_representative_exports.py scripts/fastpath_authoritative_contract.py
      - name: Verify deterministic Pages package manifest and UX staging
        run: |
          python scripts/build_pages.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          src = Path('src')
          expected = [p.relative_to(src).as_posix() for p in sorted((src/'icm_workbench').rglob('*.py')) if '__pycache__' not in p.parts]
          actual = json.loads(Path('_site/python/package-manifest.json').read_text())
          assert actual == expected, (len(actual), len(expected))
          staged = Path('_site/assets/runtime.js').read_bytes()
          release = Path('web/assets/runtime.release.js').read_bytes()
          assert staged == release
          html = Path('_site/index.html').read_text(encoding='utf-8')
          token = os.environ.get('GITHUB_SHA', 'local')
          assert f'<meta name="icm-build-sha" content="{token}" />' in html
          versioned = [
              'assets/app.css',
              'assets/workbench-v2.css',
              'assets/workbench-survey.css',
              'assets/workflow-26.css',
              'assets/precision-workbench.css',
              'assets/domain-registry.js',
              'assets/runtime.js',
              'assets/workbench-v2.js',
              'assets/fastpath-preview.js',
              'assets/workbench-v2-domfix.js',
              'assets/workbench-v3.js',
              'assets/workbench-survey.js',
              'assets/workflow-26.js',
              'assets/precision-workbench.js',
          ]
          for asset in versioned:
              assert f'{asset}?v={token}' in html, asset
          assert 'pyodide/v0.29.4/full/pyodide.js' not in html
          assert Path('_site/assets/analysis-worker.js').exists()
          assert Path('_site/assets/fastpath-core.js').exists()
          assert Path('_site/assets/fastpath-worker.js').exists()
          assert Path('_site/assets/fastpath-preview.js').exists()
          assert Path('_site/assets/domain-registry.js').exists()
          assert 'xlsx@0.18.5' in html
          assert 'type="module" src="assets/runtime.js"' not in html
          print(f'Pages manifest verified: {len(actual)} Python modules; current browser UX staged exactly.')
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assemble exact release artifact
        run: python scripts/build_pages.py
      - name: Install Chromium acceptance runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise complete browser workflow
        env:
          ICM_EVIDENCE_DIR: /tmp/icm-pr-evidence
        run: |
          python -m http.server 8000 --directory _site >/tmp/icm-pages-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Local Pages server exited before becoming ready."
              cat /tmp/icm-pages-http.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Local Pages server did not become ready within 30 seconds."
            cat /tmp/icm-pages-http.log
            exit 1
          fi
          node web/tests/smoke.mjs

      - name: Package exact review preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: precision-workbench-preview-${{ github.sha }}
          retention-days: 30
          path: _site/

      - name: Retain browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-workbench-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/icm-pr-evidence/
            reference/current-tool/reports/screenshots/FDV_Sample_Plots.png

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            /tmp/icm-workbench-failure.png
            /tmp/icm-pages-http.log


  baseline-performance:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: current
      - name: Checkout pre-FastPath main baseline
        uses: actions/checkout@v6
        with:
          ref: cb66e762b23c5cd59cf61b42a6c4b52655307cfc
          path: baseline
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build current and baseline release artifacts
        run: |
          cd current
          python scripts/build_pages.py
          cd ../baseline
          GITHUB_SHA=cb66e762b23c5cd59cf61b42a6c4b52655307cfc python scripts/build_pages.py
      - name: Install Chromium comparison runner
        working-directory: current
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure pre-FastPath versus PR25 in one runner
        working-directory: current
        env:
          ICM_BASELINE_URL: http://127.0.0.1:8001/
          ICM_CURRENT_URL: http://127.0.0.1:8000/
          ICM_BASELINE_SHA: cb66e762b23c5cd59cf61b42a6c4b52655307cfc
          ICM_BASELINE_EVIDENCE_DIR: /tmp/icm-baseline-evidence
        run: |
          python -m http.server 8000 --directory _site >/tmp/icm-current-http.log 2>&1 &
          CURRENT_PID=$!
          python -m http.server 8001 --directory ../baseline/_site >/tmp/icm-baseline-http.log 2>&1 &
          BASELINE_PID=$!
          trap 'kill "$CURRENT_PID" "$BASELINE_PID" 2>/dev/null || true' EXIT
          for port in 8000 8001; do
            READY=0
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" >/dev/null 2>&1; then READY=1; break; fi
              sleep 1
            done
            if [ "$READY" -ne 1 ]; then
              echo "Comparison server on $port failed to start."
              cat /tmp/icm-current-http.log /tmp/icm-baseline-http.log
              exit 1
            fi
          done
          node web/tests/baseline-comparison.mjs
      - name: Retain formal baseline comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastpath-baseline-comparison-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/icm-baseline-evidence/
            /tmp/icm-current-http.log
            /tmp/icm-baseline-http.log

  browser-firefox-shell:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assemble exact release artifact
        run: python scripts/build_pages.py
      - name: Install Firefox acceptance runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Verify Precision shell in Firefox
        env:
          ICM_BROWSER: firefox
        run: |
          python -m http.server 8000 --directory _site >/tmp/icm-firefox-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null 2>&1 && break
            sleep 1
          done
          node web/tests/precision-shell.mjs

  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: browser-smoke
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact verified Pages artifact
        run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    environment:
      name: pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: GitHub Pages Workbench

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/icm_workbench/**'
      - 'tests/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/icm_workbench/**'
      - 'tests/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install reference engine dependencies
        run: python -m pip install -e . pytest
      - name: Run Python regression suite
        run: python -m pytest
      - name: Validate release browser source
        run: |
          node --check web/assets/runtime.release.js
          node --check web/assets/workbench-v2.js
          node --check web/assets/workbench-v2-domfix.js
          node --check web/assets/workbench-v3.js
          node --check web/tests/smoke.mjs
          node web/tests/runtime-unit.mjs
          python -m py_compile web/python_bridge.py web/advanced_bridge.py scripts/build_pages.py scripts/validate_representative_exports.py
      - name: Verify deterministic Pages package manifest and UX staging
        run: |
          python scripts/build_pages.py
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('src')
          expected = [p.relative_to(src).as_posix() for p in sorted((src/'icm_workbench').rglob('*.py')) if '__pycache__' not in p.parts]
          actual = json.loads(Path('_site/python/package-manifest.json').read_text())
          assert actual == expected, (len(actual), len(expected))
          staged = Path('_site/assets/runtime.js').read_bytes()
          release = Path('web/assets/runtime.release.js').read_bytes()
          assert staged == release
          html = Path('_site/index.html').read_text(encoding='utf-8')
          assert '<script src="assets/runtime.js"></script>' in html
          assert '<script src="assets/workbench-v2.js"></script>' in html
          assert '<script src="assets/workbench-v2-domfix.js"></script>' in html
          assert '<script src="assets/workbench-v3.js"></script>' in html
          assert 'workbench-v2.css' in html
          assert 'type="module" src="assets/runtime.js"' not in html
          print(f'Pages manifest verified: {len(actual)} Python modules; current browser UX staged exactly.')
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Assemble exact release artifact
        run: python scripts/build_pages.py
      - name: Install Chromium acceptance runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise complete browser workflow
        run: |
          python -m http.server 8000 --directory _site >/tmp/icm-pages-http.log 2>&1 &
          node web/tests/smoke.mjs

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            /tmp/icm-workbench-failure.png
            /tmp/icm-pages-http.log

  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: browser-smoke
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build exact verified Pages artifact
        run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    environment:
      name: pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Reference history cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/purge_reference_history.py'
      - '.github/workflows/reference-history-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-history-cleanup
  cancel-in-progress: false

jobs:
  sanitize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install existing test dependencies and pinned history filter
        run: python -m pip install -e . pytest git-filter-repo==2.47.0
      - name: Verify selective cleanup and publish with an exact-head lease
        run: python scripts/purge_reference_history.py --destination "$RUNNER_TEMP/sanitized-reference-history" --publish

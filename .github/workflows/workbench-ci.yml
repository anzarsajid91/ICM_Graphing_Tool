name: Workbench CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - feat/icm-workbench-modernisation
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest
      - name: Validate synthetic current-tool reference samples
        if: runner.os == 'Linux'
        run: python scripts/validate_reference_samples.py
      - run: python -m compileall -q src

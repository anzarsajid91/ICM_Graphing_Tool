name: Workbench CI
on:
  pull_request:
  push:
    branches:
      - feat/icm-workbench-modernisation
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest
      - name: Validate uploaded current-tool reference samples
        if: runner.os == 'Linux'
        run: python scripts/validate_reference_samples.py
      - run: python -m compileall -q src

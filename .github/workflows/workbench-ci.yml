name: Workbench CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - feat/icm-workbench-modernisation
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest
      - name: Validate synthetic current-tool reference samples
        if: runner.os == 'Linux'
        run: python scripts/validate_reference_samples.py
      - run: python -m compileall -q src

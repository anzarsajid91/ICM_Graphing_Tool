name: Secret detection
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install pinned open-source scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan all reachable Git history without publishing evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--all" --report-format=json --report-path=/tmp/gitleaks-redacted.json > /tmp/gitleaks.log 2>&1; then
            echo "::error::Secret scan failed. Restricted maintainer investigation is required; potential sensitive evidence is not published."
            exit 1
          fi
          echo "Full reachable-history secret scan passed."

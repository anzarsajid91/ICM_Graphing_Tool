name: Network annual review preview
on:
  push:
    branches: [test/network-annual-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: GitHub Pages Workbench-production
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/test/network-annual-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: pages-release
      url: ${{ steps.deployment.outputs.page_url }}preview/network-annual-review/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: preview-source
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: production-source
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify annual assessment contracts
        working-directory: preview-source
        run: |
          python -m pip install -e . pytest
          python -m pytest
          node --check web/assets/network-schematic.js
          node web/tests/network-schematic-unit.mjs
          node web/tests/network-review-unit.mjs
          GITHUB_EVENT_NAME=pull_request python scripts/build_pages.py
      - name: Exercise annual network review
        working-directory: preview-source
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python -m http.server 8000 --directory _site >/tmp/network-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node web/tests/network-schematic-smoke.mjs
          node web/tests/network-review-smoke.mjs
          node web/tests/network-layout-smoke.mjs
          node web/tests/workspace-interactions.mjs
      - name: Preserve main release and add isolated preview
        run: |
          MAIN_SHA=$(git -C production-source rev-parse HEAD)
          (cd production-source && GITHUB_SHA="$MAIN_SHA" GITHUB_EVENT_NAME=push python scripts/build_pages.py)
          python preview-source/scripts/stage_network_preview.py production-source/_site preview-source/_site
          test "$(git -C production-source ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: production-source/_site
      - name: Publish preview alongside unchanged main
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

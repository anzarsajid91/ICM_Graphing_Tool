name: Live release metadata and IT Security evidence
on:
  push:
    branches: [security/release-record-diagnostics]
permissions:
  contents: read
jobs:
  live-security-evidence:
    runs-on: ubuntu-latest
    env:
      ICM_BASE_URL: https://anzarsajid91.github.io/ICM_Graphing_Tool/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4bba015c7914b68f8cd6f3255cb7fb72322a4164
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Verify actual live version and revision
        run: |
          curl --fail --silent --show-error --location --retry 3 "https://anzarsajid91.github.io/ICM_Graphing_Tool/build.json?verify=4bba015c7914b68f8cd6f3255cb7fb72322a4164" --output "$RUNNER_TEMP/live-build.json"
          python3 -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"live-build.json").read_text()); assert d["commit"]=="4bba015c7914b68f8cd6f3255cb7fb72322a4164"; assert d["app_version"]=="v1.068"; print("LIVE_RELEASE_IDENTITY "+json.dumps(d))'
      - name: Install locked acceptance runner
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Capture production IT Security acceptance evidence
        env:
          ICM_EVIDENCE_DIR: ${{ runner.temp }}/live-it-security
        run: node web/tests/security-about-smoke.mjs
      - name: Retain public build metadata and synthetic screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-it-security-4bba015c7914b68f8cd6f3255cb7fb72322a4164
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/live-build.json
            ${{ runner.temp }}/live-it-security/

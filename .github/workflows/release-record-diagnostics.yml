name: Release record diagnostics
on:
  push:
    branches: [security/release-record-diagnostics]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  inspect-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const {owner,repo}=context.repo;
            const {data:repository}=await github.rest.repos.get({owner,repo});
            const {data:comment}=await github.rest.issues.getComment({owner,repo,comment_id:6247663292});
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:94});
            const {data:rule}=await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',{owner,repo,ruleset_id:25314721});
            const {node}=await github.graphql('query($id:ID!){node(id:$id){... on IssueComment{id body createdAt updatedAt lastEditedAt isMinimized editor{login} repository{nameWithOwner} author{__typename login ... on User{databaseId}}}}}',{id:comment.node_id});
            const ack=JSON.parse(comment.body.slice('HYDRA_RELEASE_ACK_V1\n'.length));
            core.info(JSON.stringify({repository:repository.full_name,owner:repository.owner,rest:{id:comment.id,node_id:comment.node_id,user:comment.user.login,userId:comment.user.id,userType:comment.user.type,created:comment.created_at,updated:comment.updated_at},graphql:node?{id:node.id,bodyMatches:node.body===comment.body,createdAt:node.createdAt,updatedAt:node.updatedAt,lastEditedAt:node.lastEditedAt,isMinimized:node.isMinimized,editor:node.editor,repository:node.repository,author:node.author}:null,pr:{number:pr.number,merged_at:pr.merged_at,head:pr.head.sha,merge:pr.merge_commit_sha},ruleset:{id:rule.id,source:rule.source,source_type:rule.source_type,updated_at:rule.updated_at,bypassVisible:Object.hasOwn(rule,'bypass_actors')},acknowledgement:ack},null,2));
            await require('./.github/scripts/verify-owner-release-ack.cjs')({github,owner,repo,pr,sha:pr.merge_commit_sha,rulesets:[rule],core});

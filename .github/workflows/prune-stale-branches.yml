name: One-shot stale branch cleanup

on:
  push:
    branches:
      - fix/post-pr25-navigation-threshold-reports
    paths:
      - .github/workflows/prune-stale-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete explicitly approved stale branches
        shell: bash
        run: |
          set -uo pipefail
          branches=(
          "feat/browser-state-readiness-hardening"
          "feat/engineering-correctness-phase1"
          "feat/engineering-ui-graph-survey-2026-09-19"
          "feat/engineering-workflows-phase2"
          "feat/fdv-native-zoom-workflow-2026-09-20"
          "feat/flow-survey-assessment-advanced"
          "feat/github-pages-zero-install"
          "feat/icm-workbench-modernisation"
          "feat/kernel-worker-domain-2026-09-19"
          "feat/live-recursive-verification-2026-09-19"
          "feat/precision-workbench-fastpath"
          "feat/precision-workbench-redesign-2026-09-20"
          "feat/professional-graph-assessment-v2"
          "feat/survey-association-workflow"
          "feat/ui-report-professionalisation"
          "fix/cache-coherent-live-pages-2026-09-19"
          "fix/graph-no-rainfall-axis"
          "fix/live-regression-11-report-context"
          "fix/live-regression-survey-report-11"
          "fix/live-verification-scheduled-target"
          "fix/rainfall-unknown-validity-audit-2026-09-20"
          "fix/reference-data-integration-20260920"
          "fix/reference-graphs-reports-20260920"
          "fix/ui-performance-spill-parity"
          "fix/usability-2026-09-19"
          "refactor/source-pool-state-events"
          )
          failed=()
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              if ! git push origin --delete "$branch"; then
                failed+=("$branch")
              fi
            else
              echo "Already absent: $branch"
            fi
          done
          if (( ${#failed[@]} )); then
            printf 'Failed to delete: %s\n' "${failed[@]}"
            exit 1
          fi
          echo "Stale branch cleanup complete."
